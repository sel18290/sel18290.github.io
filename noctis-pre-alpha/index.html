<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131e">
<meta name="robots" content="noindex,nofollow">
<title>Accès privé · NOCTIS pré-alpha · CORTEX</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
html{min-height:100%;background:#040d18}
body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:clamp(18px,4vw,48px);color:#edfaff;background:radial-gradient(ellipse at 50% 5%,#1b4254 0%,transparent 45%),radial-gradient(ellipse at 85% 85%,#122547 0%,transparent 50%),linear-gradient(145deg,#040b14,#071825 70%,#060f20)}
main{width:min(100%,475px);padding:clamp(23px,5vw,42px);border:1px solid #7199af80;border-radius:23px;background:linear-gradient(150deg,#101f31e8,#0c1726f3);box-shadow:0 25px 90px #0008,inset 0 1px #bbf6ff17}
.logo{display:flex;gap:10px;align-items:center;font-size:11px;font-weight:750;letter-spacing:.16em;color:#a1e6eb}
.logo span{display:grid;place-items:center;width:35px;height:35px;border:1px solid #73bfb7;border-radius:11px;background:#164a4b;color:#cbfff3;font-size:23px}
.eyebrow{margin:30px 0 8px;color:#8bc7cf;font-size:11px;letter-spacing:.15em;font-weight:750}
h1{font-size:clamp(31px,8vw,49px);line-height:1.08;letter-spacing:-.045em;margin:0 0 15px}
h1 em{font-style:normal;color:#92e6d4}
.desc{font-size:14px;line-height:1.7;color:#bfd3df;margin:0 0 26px}
label{display:block;color:#dceef4;font-size:13px;font-weight:700;margin-bottom:9px}
input{width:100%;min-height:51px;border:1px solid #7999aa;border-radius:11px;background:#081723;color:#fff;padding:12px 14px;font-family:inherit;font-size:16px;font-weight:500;line-height:1.3;outline:none}
input:focus-visible{border-color:#a9fff0;box-shadow:0 0 0 3px #7be7d02c}
form button{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;margin-top:14px;min-height:50px;border:1px solid #80edda;border-radius:11px;background:linear-gradient(120deg,#8febdd,#72c6cf);color:#08212c;font-family:inherit;font-size:14px;font-weight:850;line-height:1.35;cursor:pointer}
form button:disabled{opacity:.7;cursor:wait}
form button:hover:not(:disabled){filter:brightness(1.06)}
.error{min-height:22px;margin:10px 0 0;font-size:12px;color:#ffb9b4;font-weight:680}
.bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:16px}
.bottom a{color:#a7d5dc;font-size:12px;text-underline-offset:4px}
.bottom a:focus-visible,form button:focus-visible{outline:3px solid #a9f6e7;outline-offset:3px}
@media(max-width:390px){main{padding:22px 18px}.eyebrow{margin-top:22px}.bottom{justify-content:center}}
</style>
</head>
<body>
<main>
 <div class="logo"><span aria-hidden="true">◈</span> CORTEX · GENESIS</div>
 <p class="eyebrow">ACCÈS RÉSERVÉ · VERSION PRÉ-ALPHA</p>
 <h1>Le seuil de <em>NOCTIS.</em></h1>
 <p class="desc">Cette version de développement est accessible avec un code. Saisis-le pour entrer dans l’aventure.</p>
 <form id="access-form" autocomplete="off">
  <label for="access-code">Code d’accès</label>
  <input id="access-code" name="access" type="password" placeholder="Saisir le code" autocomplete="off" autocapitalize="off" spellcheck="false" required autofocus aria-describedby="access-error">
  <button id="access-button" type="submit">Déverrouiller NOCTIS <span aria-hidden="true">↗</span></button>
  <p class="error" role="status" id="access-error" aria-live="polite"></p>
 </form>
 <div class="bottom"><a href="/creations/evaluations/#accueil">↖ Retour à CORTEX</a><a href="/creations/">Mes créations</a></div>
</main>
<noscript>Le code d’accès nécessite JavaScript.</noscript>
<script>
(function(){
 'use strict';
 const KEY='cortex:noctis-pre-alpha:granted:v1';
 const GAME='/noctis-pre-alpha/fusion-native/noctis/aventure-n01.html?aventure=1';
 try{if(sessionStorage.getItem(KEY)==='ok'){location.replace(GAME);return;}}catch(_){}
 const form=document.getElementById('access-form');
 const input=document.getElementById('access-code');
 const button=document.getElementById('access-button');
 const error=document.getElementById('access-error');
 form.addEventListener('submit',async function(event){
  event.preventDefault();
  button.disabled=true;
  error.textContent='';
  try{
   const normalized=input.value.normalize('NFKC').trim().toLocaleLowerCase('fr-FR').replace(/[.!?]+$/,'').trim().replace(/\s+/g,' ');
   const data=new TextEncoder().encode(normalized);
   const buf=await crypto.subtle.digest('SHA-256',data);
   const hash=Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('');
   const matches=hash==='1136bb0edadb93090687bb98c43ec412a750c37bb74410d7a888cc334446c7d8';
   if(!matches){error.textContent='Code incorrect. Vérifie la phrase et réessaie.';input.focus();input.select();return;}
   sessionStorage.setItem(KEY,'ok');
   location.assign(GAME);
  }catch(_){error.textContent='Accès impossible sur ce navigateur. Vérifie ses paramètres de stockage.';}
  finally{button.disabled=false;}
 });
})();
</script>
</body>
</html>
